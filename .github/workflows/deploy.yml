name: Test and deploy

# On every push to main: test, deploy the API to Cloud Run, then build the web app against that API and deploy it to Firebase Hosting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to Google Cloud (no keys stored)

env:
  PROJECT_ID: gstcashcopilot
  REGION: asia-south1
  SERVICE: cashpilot-api
  IMAGE: asia-south1-docker.pkg.dev/gstcashcopilot/cashpilot/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt }
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web type check
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --project "$PROJECT_ID" --region "$REGION" \
            --service-account "cashpilot-api@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --network default --subnet default --vpc-egress private-ranges-only \
            --timeout 3600 --memory 1Gi --cpu 1 --min-instances 0 --max-instances 3 \
            --set-env-vars "^@^AUTH_MODE=firebase@FIREBASE_PROJECT_ID=$PROJECT_ID@AUTO_SEED=false@CORS_ORIGINS=https://$PROJECT_ID.web.app,https://$PROJECT_ID.firebaseapp.com" \
            --set-secrets "GEMINI_API_KEY=gemini-key:latest,DATABASE_URL=database-url:latest"
      - id: url
        run: echo "url=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build the static site against the deployed API
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-api.outputs.url }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive
